default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "") %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  sslmode: disable

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "snippets_app_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "snippets_app_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "snippets_app_production") %>
