default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV["RAILS_MAX_THREADS"] { 5 } %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>
  host: <%= ENV["POSTGRES_HOST"] %>
  port: <%= ENV["POSTGRES_PORT"] %>
  sslmode: disable

development:
  <<: *default
  database: snippets_app_development

test:
  <<: *default
  database: ssnippets_app_test

production:
  <<: *default
  database: snippets_app_production
